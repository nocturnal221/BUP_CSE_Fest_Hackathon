services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridwise_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gridwise_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
